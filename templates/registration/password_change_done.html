{% extends "../base.html" %}
{% load static %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="auth-container">
    <form method="post" class="auth-form">
        {% csrf_token %}
        <h2>Изменение пароля</h2>
        <h3>Ваш пароль успешно изменён!</h3>

        <div class="d-flex main-buttons">
            <a href="{% url 'users:profile' request.user.id %}" class="main-btn">В профиль</a>
        </div>
    </form>
</div>
{% endblock %}
