{% extends "../base.html" %}
{% load static %}

{% block title %}
{{ book.title }}
{% endblock %}

{% block content %}
<div class="row book-detail">

    <!-- Правая колонка: информация -->
    <div class="col-md-8 col-lg-9">

        <!-- Название -->
        <h1 class="book-title">{{ user.username }}</h1>

        <li>Регистрация: {{ user.date_joined }}</li>
        <li>Роль: {% if user.is_staff %}Админ{% else %}Пользователь{% endif %}</li>

        <p class="book-author">
            <a href="">Закладки</a>
            <a href="">Прочитанные</a>
        </p>
    </div>
</div>
{% endblock %}
